  <text x="240" y="128" fill="#F2F5FA" font-size="62" font-weight="700" letter-spacing="-1.5">groundtruth</text>
  <text x="243" y="172" fill="#9AA5B6" font-size="21">Every claim in your docs, tied to a verbatim quote in a real source.</text>
