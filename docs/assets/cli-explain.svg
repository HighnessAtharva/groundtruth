<svg xmlns="http://www.w3.org/2000/svg" width="704" height="282" viewBox="0 0 704 282" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5"><rect width="704" height="282" rx="12" fill="#0B0E14"/><path d="M0 12 a12 12 0 0 1 12 -12 h680 a12 12 0 0 1 12 12 v22 h-704 z" fill="#151A24"/><rect x="0.5" y="0.5" width="703" height="281" rx="11.5" fill="none" stroke="#242C3A"/><circle cx="20" cy="17" r="5.5" fill="#FF5F57"/><circle cx="38" cy="17" r="5.5" fill="#FEBC2E"/><circle cx="56" cy="17" r="5.5" fill="#28C840"/><text x="352.0" y="21.5" fill="#7C8798" font-size="11.5" text-anchor="middle">groundtruth explain</text><text x="22" y="52.0" xml:space="preserve"><tspan fill="#4ADE80">$ </tspan><tspan fill="#F2F5FA">groundtruth explain ground.verdict</tspan></text><text x="22" y="73.0" xml:space="preserve"></text><text x="22" y="94.0" xml:space="preserve"><tspan fill="#D5DBE6">ground.verdict · grounding · mechanical</tspan></text><text x="22" y="115.0" xml:space="preserve"></text><text x="22" y="136.0" xml:space="preserve"><tspan fill="#D5DBE6">  A claim carries a verdict whose severity is set to warn or error in config.</tspan></text><text x="22" y="157.0" xml:space="preserve"><tspan fill="#7C8798">  UNSOURCED and CONTRADICTED block by default, INFERRED and DOC-DEFECT warn, and</tspan></text><text x="22" y="178.0" xml:space="preserve"><tspan fill="#7C8798">  VERIFIED, EXTERNAL and FIGURE are clean.</tspan></text><text x="22" y="199.0" xml:space="preserve"></text><text x="22" y="220.0" xml:space="preserve"><tspan fill="#D5DBE6">Severity</tspan></text><text x="22" y="241.0" xml:space="preserve"><tspan fill="#D5DBE6">  error (blocks), from the rule default</tspan></text></svg>