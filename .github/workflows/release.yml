# Publish to npm from CI, with provenance.
#
# Provenance links the published tarball to the exact commit and workflow run that
# built it, and npm shows the badge on the package page. It needs three things, all
# of which are true here: a public repository, `id-token: write`, and npm 9.5 or
# later, which Node 20 ships.
#
# The trigger is a published GitHub Release rather than a tag push, so the release
# notes and the publish are one deliberate act. `workflow_dispatch` is there for a
# dry run that proves the whole path without publishing anything.
#
# Setup, once: create an **Automation** token at npmjs.com under Access Tokens and
# add it as the `NPM_TOKEN` repository secret. An Automation token bypasses 2FA,
# which is the point: a CI publish cannot type a one-time password.

name: release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Run every check and pack the tarball, but do not publish'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for provenance
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # Without registry-url, NODE_AUTH_TOKEN is ignored and the publish fails
          # with a 401 that reads like a bad token.
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      # The tag and the manifest must agree, or you publish 0.1.0 under v0.2.0 and
      # the mismatch is invisible until somebody installs the wrong thing.
      - name: tag matches package.json
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag $GITHUB_REF_NAME implies $tag but package.json says $manifest"
            exit 1
          fi
          echo "publishing $manifest"

      # The package name comes from the manifest, never a literal. It was
      # hardcoded once, and renaming the package left these steps checking a
      # name nobody was publishing.
      - name: this version is not already on the registry
        if: github.event_name == 'release'
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          if npm view "$name@$version" version --silent 2>/dev/null; then
            echo "::error::$name@$version is already published. Bump the version."
            exit 1
          fi
          echo "$name@$version is unclaimed"

      - name: tests
        run: npm test

      - name: examples report what they are supposed to report
        run: npm run test:examples

      # The property the committed cache exists for. If this fails, the package
      # would ship a broken offline story.
      - name: examples verify with no network
        run: npm run test:offline

      - name: pack
        run: npm pack

      - name: what would ship
        run: |
          tar -tzf ./*.tgz | sed 's|^package/||' | sort
          echo "---"
          ls -lh ./*.tgz

      - name: publish
        if: github.event_name == 'release'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: the registry agrees
        if: github.event_name == 'release'
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          # A first publish under a new scope can take several minutes to become
          # readable, so this waits ~5 minutes. `npm publish` printing `+ pkg@ver`
          # already means the write succeeded; this only confirms readability.
          for attempt in $(seq 1 20); do
            if [ "$(npm view "$name@$version" version --silent 2>/dev/null)" = "$version" ]; then
              echo "$name@$version is readable after $((attempt * 15))s"
              exit 0
            fi
            echo "attempt $attempt: not readable yet"
            sleep 15
          done
          echo "::warning::$name@$version published, but was not readable within 5 minutes. This is usually propagation on a new scope, not a failed publish. Check https://www.npmjs.com/package/$name"
          exit 1

      # Proof the published artifact works, rather than proof it uploaded.
      - name: install the published package and run it
        if: github.event_name == 'release'
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          work="$(mktemp -d)"
          cd "$work"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$name@$version"
          mkdir -p docs
          printf '# A doc\n\nThe cache holds 512 items and evicts the oldest first.\n' > docs/a.md
          # Call the bin directly. The package name and the command differ, so
          # this also proves the bin map survived publishing.
          gt=./node_modules/.bin/groundtruth
          test -x "$gt" || { echo "::error::the package exposes no groundtruth command"; exit 1; }
          "$gt" --version
          "$gt" init --modules readability
          "$gt" check

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tarball
          # Not a name-derived glob. `npm pack` renames a scoped tarball, so the
          # first scoped release uploaded nothing and said so only in a warning.
          path: '*.tgz'
          retention-days: 14
